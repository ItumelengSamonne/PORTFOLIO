<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Itumeleng</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
</head>
<body>
  <main id="main" tabindex="-1" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;">
    <div>
      <p style="font-family:var(--font-mono);font-size:0.8rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint);">404</p>
      <h1 style="font-family:var(--font-serif);font-size:clamp(2.4rem,1.6rem+4vw,4rem);margin:0.5rem 0 1rem;">Lost in the <em style="font-style:italic;color:var(--accent);text-shadow:var(--accent-glow);">data</em></h1>
      <p style="color:var(--text-soft);max-width:44ch;margin:0 auto 1.5rem;">The page you're looking for doesn't exist or has moved. Let's get you back.</p>
      <a class="button button-primary" href="index.html">Back to home</a>
    </div>
  </main>
</body>
</html>
